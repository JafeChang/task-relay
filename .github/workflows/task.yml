name: Task
run-name: Task

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution environment
        required: true
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-26-intel
          - macos-26
      ticket:
        description: Authenticated task envelope
        required: true
        type: string

permissions:
  contents: read

jobs:
  task:
    name: Task
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check execution mode
        if: runner.debug == '1'
        shell: bash
        run: exit 1
      - name: Execute
        if: runner.debug != '1'
        shell: bash
        env:
          EXECUTOR_RUNNER: ${{ inputs.runner }}
          TICKET: ${{ inputs.ticket }}
          EXECUTION_KEY: ${{ secrets.EXECUTION_KEY }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RESULT_TOKEN: ${{ secrets.RESULT_TOKEN }}
        run: node executor.mjs
